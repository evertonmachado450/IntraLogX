<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle de 3 LEDs - Arduino IoT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Paho MQTT WebSockets Client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .led-glow-on {
            box-shadow: 0 0 25px #22c55e, inset 0 0 10px #4ade80;
        }
        .led-glow-off {
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="w-full max-w-lg bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-slate-700 rounded-lg text-sky-400">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Painel Arduino</h1>
                    <p class="text-xs text-slate-400">Controle de 3 LEDs Independentes</p>
                </div>
            </div>
            <!-- Status Badge -->
            <div id="status-badge" class="flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="status-text">Conectando...</span>
            </div>
        </div>

        <!-- Visualizer Area (3 LEDs) -->
        <div class="grid grid-cols-3 gap-3 py-4 bg-slate-900/50 rounded-xl border border-slate-700/50 p-4">
            <!-- LED 1 -->
            <div class="flex flex-col items-center space-y-2">
                <div id="led-indicator-1" class="w-16 h-16 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center transition-all duration-300 led-glow-off">
                    <i data-lucide="zap" id="led-icon-1" class="w-7 h-7 text-slate-600 transition-colors duration-300"></i>
                </div>
                <span id="led-status-1" class="text-xs font-bold text-slate-400 uppercase">LED 1 OFF</span>
            </div>
            <!-- LED 2 -->
            <div class="flex flex-col items-center space-y-2">
                <div id="led-indicator-2" class="w-16 h-16 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center transition-all duration-300 led-glow-off">
                    <i data-lucide="zap" id="led-icon-2" class="w-7 h-7 text-slate-600 transition-colors duration-300"></i>
                </div>
                <span id="led-status-2" class="text-xs font-bold text-slate-400 uppercase">LED 2 OFF</span>
            </div>
            <!-- LED 3 -->
            <div class="flex flex-col items-center space-y-2">
                <div id="led-indicator-3" class="w-16 h-16 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center transition-all duration-300 led-glow-off">
                    <i data-lucide="zap" id="led-icon-3" class="w-7 h-7 text-slate-600 transition-colors duration-300"></i>
                </div>
                <span id="led-status-3" class="text-xs font-bold text-slate-400 uppercase">LED 3 OFF</span>
            </div>
        </div>

        <!-- Individual Controls -->
        <div class="space-y-3">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Controles Individuais</h2>
            <div class="grid grid-cols-3 gap-3">
                <button onclick="alternarLED(1)" class="flex flex-col items-center justify-center py-2.5 px-2 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-bold rounded-xl shadow transition-all transform active:scale-95">
                    <i data-lucide="power" class="w-4 h-4 mb-1"></i>
                    <span class="text-xs">LED 1</span>
                </button>
                <button onclick="alternarLED(2)" class="flex flex-col items-center justify-center py-2.5 px-2 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-bold rounded-xl shadow transition-all transform active:scale-95">
                    <i data-lucide="power" class="w-4 h-4 mb-1"></i>
                    <span class="text-xs">LED 2</span>
                </button>
                <button onclick="alternarLED(3)" class="flex flex-col items-center justify-center py-2.5 px-2 bg-sky-600 hover:bg-sky-500 active:bg-sky-700 text-white font-bold rounded-xl shadow transition-all transform active:scale-95">
                    <i data-lucide="power" class="w-4 h-4 mb-1"></i>
                    <span class="text-xs">LED 3</span>
                </button>
            </div>
        </div>

        <!-- Global Controls -->
        <div class="space-y-3 pt-2">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Controles Globais</h2>
            <div class="grid grid-cols-2 gap-4">
                <button onclick="enviarComando('A')" class="flex items-center justify-center space-x-2 py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition-all transform active:scale-95">
                    <i data-lucide="zap" class="w-5 h-5"></i>
                    <span>LIGAR TODOS</span>
                </button>
                <button onclick="enviarComando('D')" class="flex items-center justify-center space-x-2 py-3 px-4 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold rounded-xl shadow-lg transition-all transform active:scale-95">
                    <i data-lucide="power-off" class="w-5 h-5"></i>
                    <span>DESLIGAR TODOS</span>
                </button>
            </div>
        </div>

        <!-- Configuration Details -->
        <div class="pt-4 border-t border-slate-700/60 text-xs text-slate-400 space-y-1">
            <div class="flex justify-between">
                <span>Broker:</span>
                <span class="font-mono text-slate-300">broker.hivemq.com</span>
            </div>
            <div class="flex justify-between">
                <span>Tópico:</span>
                <span class="font-mono text-slate-300 truncate max-w-[200px]" title="gerry_sanchez_led_exclusivo/arduino">gerry_sanchez_led_exclusivo/arduino</span>
            </div>
        </div>

    </div>

    <script>
        lucide.createIcons();

        const BROKER = "broker.hivemq.com";
        const PORTA = 8884;
        const TOPICO = "gerry_sanchez_led_exclusivo/arduino";
        const CLIENT_ID = "web_client_" + Math.random().toString(16).substr(2, 8);

        let cliente = new Paho.MQTT.Client(BROKER, Number(PORTA), CLIENT_ID);

        // Estado local dos 3 LEDs
        const estadoLeds = { 1: false, 2: false, 3: false };

        cliente.onConnectionLost = aoPerderConexao;
        cliente.onMessageArrived = aoChegarMensagem;

        conectar();

        function conectar() {
            atualizarStatus("Conectando...", "amber");
            cliente.connect({
                onSuccess: aoConectarSucesso,
                onFailure: aoConectarFalha,
                useSSL: true
            });
        }

        function aoConectarSucesso() {
            atualizarStatus("Conectado", "emerald");
            cliente.subscribe(TOPICO);
        }

        function aoConectarFalha(responseObject) {
            atualizarStatus("Erro Conexão", "rose");
            setTimeout(conectar, 5000);
        }

        function aoPerderConexao(responseObject) {
            atualizarStatus("Desconectado", "rose");
            if (responseObject.errorCode !== 0) {
                setTimeout(conectar, 3000);
            }
        }

        function aoChegarMensagem(message) {
            const cmd = message.payloadString.trim();
            tratarComando(cmd);
        }

        function alternarLED(num) {
            // Se estiver ligado, envia o comando para desligar; caso contrário, para ligar.
            // LED 1: '1' ON, '0' OFF
            // LED 2: '2' ON, '3' OFF
            // LED 3: '4' ON, '5' OFF
            let cmd = "";
            if (num === 1) cmd = estadoLeds[1] ? '0' : '1';
            if (num === 2) cmd = estadoLeds[2] ? '3' : '2';
            if (num === 3) cmd = estadoLeds[3] ? '5' : '4';

            enviarComando(cmd);
        }

        function enviarComando(valor) {
            if (cliente.isConnected()) {
                const mensagem = new Paho.MQTT.Message(valor);
                mensagem.destinationName = TOPICO;
                cliente.send(mensagem);
                tratarComando(valor);
            } else {
                alert("O cliente MQTT não está conectado ao broker!");
            }
        }

        function tratarComando(cmd) {
            if (cmd === '1') atualizarInterfaceLED(1, true);
            else if (cmd === '0') atualizarInterfaceLED(1, false);
            else if (cmd === '2') atualizarInterfaceLED(2, true);
            else if (cmd === '3') atualizarInterfaceLED(2, false);
            else if (cmd === '4') atualizarInterfaceLED(3, true);
            else if (cmd === '5') atualizarInterfaceLED(3, false);
            else if (cmd === 'A') { // Ligar Todos
                atualizarInterfaceLED(1, true);
                atualizarInterfaceLED(2, true);
                atualizarInterfaceLED(3, true);
            } else if (cmd === 'D') { // Desligar Todos
                atualizarInterfaceLED(1, false);
                atualizarInterfaceLED(2, false);
                atualizarInterfaceLED(3, false);
            }
        }

        function atualizarInterfaceLED(num, ligado) {
            estadoLeds[num] = ligado;

            const indicator = document.getElementById(`led-indicator-${num}`);
            const icon = document.getElementById(`led-icon-${num}`);
            const statusText = document.getElementById(`led-status-${num}`);

            if (ligado) {
                indicator.className = "w-16 h-16 rounded-full bg-emerald-500 border-4 border-emerald-300 flex items-center justify-center transition-all duration-300 led-glow-on";
                icon.className = "w-7 h-7 text-white transition-colors duration-300";
                statusText.innerText = `LED ${num} ON`;
                statusText.className = "text-xs font-bold text-emerald-400 uppercase";
            } else {
                indicator.className = "w-16 h-16 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center transition-all duration-300 led-glow-off";
                icon.className = "w-7 h-7 text-slate-600 transition-colors duration-300";
                statusText.innerText = `LED ${num} OFF`;
                statusText.className = "text-xs font-bold text-slate-400 uppercase";
            }
        }

        function atualizarStatus(texto, cor) {
            const statusBadge = document.getElementById("status-badge");
            const statusDot = document.getElementById("status-dot");
            const statusText = document.getElementById("status-text");

            statusText.innerText = texto;

            if (cor === "emerald") {
                statusBadge.className = "flex items-center space-x-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold";
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-400";
            } else if (cor === "rose") {
                statusBadge.className = "flex items-center space-x-2 px-3 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs font-semibold";
                statusDot.className = "w-2 h-2 rounded-full bg-rose-400";
            } else {
                statusBadge.className = "flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold";
                statusDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
            }
        }
    </script>
</body>
</html>
