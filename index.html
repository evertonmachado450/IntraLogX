<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel MQTT - Inspeção de Peças</title>
    <!-- Lib Paho MQTT para Navegador -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
            width: 320px;
        }
        h1 { color: #00e676; margin-top: 0; }
        .val { font-size: 28px; font-weight: bold; color: #ffeb3b; margin: 15px 0; }
        .status { font-size: 14px; color: #888; }
    </style>
</head>
<body>

    <div class="card">
        <h1>Inspeção MQTT</h1>
        <p>Forma Geométrica:</p>
        <div id="forma" class="val">Aguardando...</div>
        <p>Área Detectada:</p>
        <div id="area" class="val">0 px</div>
        <p class="status" id="status">Conectando ao Broker MQTT...</p>
    </div>

    <script>
        // Configurações do Broker MQTT via WebSocket
        const client = new Paho.MQTT.Client("test.mosquitto.org", 8081, "web_client_" + Math.random());

        client.onConnectionLost = onConnectionLost;
        client.onMessageArrived = onMessageArrived;

        client.connect({
            onSuccess: onConnect,
            useSSL: true
        });

        function onConnect() {
            document.getElementById("status").innerText = "Status: Conectado ao MQTT";
            document.getElementById("status").style.color = "#00e676";
            // Inscreve nos tópicos enviados pelo Python
            client.subscribe("inspecao/visao/forma");
            client.subscribe("inspecao/visao/area");
        }

        function onConnectionLost(responseObject) {
            if (responseObject.errorCode !== 0) {
                document.getElementById("status").innerText = "Status: Desconectado";
                document.getElementById("status").style.color = "#ff5252";
            }
        }

        function onMessageArrived(message) {
            if (message.destinationName === "inspecao/visao/forma") {
                document.getElementById("forma").innerText = message.payloadString;
            }
            if (message.destinationName === "inspecao/visao/area") {
                document.getElementById("area").innerText = message.payloadString + " px";
            }
        }
    </script>
</body>
</html>
