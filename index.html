<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Controle do LED - Arduino IoT</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Paho MQTT WebSockets Client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js" type="text/javascript"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            500: '#0ea5e9',
                            600: '#0284c7',
                            900: '#0c4a6e',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        .led-glow-on {
            box-shadow: 0 0 30px #22c55e, inset 0 0 15px #4ade80;
        }
        .led-glow-off {
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col items-center justify-center p-4 font-sans">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-2xl border border-slate-700 p-6 space-y-6">
        
        <!-- Header -->
        <div class="flex items-center justify-between border-b border-slate-700 pb-4">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-slate-700 rounded-lg text-sky-400">
                    <i data-lucide="cpu" class="w-6 h-6"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-wide">Painel Arduino</h1>
                    <p class="text-xs text-slate-400">Controle de LED - Porta 13</p>
                </div>
            </div>
            <!-- Status Badge -->
            <div id="status-badge" class="flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold">
                <span id="status-dot" class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                <span id="status-text">Conectando...</span>
            </div>
        </div>

        <!-- Visualizer Area -->
        <div class="flex flex-col items-center justify-center py-6 bg-slate-900/50 rounded-xl border border-slate-700/50 space-y-4">
            <!-- LED Circle Indicator -->
            <div id="led-indicator" class="w-24 h-24 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center transition-all duration-300 led-glow-off">
                <i data-lucide="zap" id="led-icon" class="w-10 h-10 text-slate-600 transition-colors duration-300"></i>
            </div>
            <div class="text-center">
                <span id="led-status-text" class="text-sm font-medium text-slate-400 uppercase tracking-wider">LED Desligado</span>
            </div>
        </div>

        <!-- Controls -->
        <div class="grid grid-cols-2 gap-4">
            <button id="btn-on" onclick="enviarComando('1')" class="flex items-center justify-center space-x-2 py-3 px-4 bg-emerald-600 hover:bg-emerald-500 active:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition-all transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="power" class="w-5 h-5"></i>
                <span>LIGAR</span>
            </button>
            <button id="btn-off" onclick="enviarComando('0')" class="flex items-center justify-center space-x-2 py-3 px-4 bg-rose-600 hover:bg-rose-500 active:bg-rose-700 text-white font-bold rounded-xl shadow-lg transition-all transform active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed">
                <i data-lucide="power-off" class="w-5 h-5"></i>
                <span>DESLIGAR</span>
            </button>
        </div>

        <!-- Configuration Details (Collapsible/Footer) -->
        <div class="pt-4 border-t border-slate-700/60 text-xs text-slate-400 space-y-1">
            <div class="flex justify-between">
                <span>Broker:</span>
                <span class="font-mono text-slate-300">broker.hivemq.com</span>
            </div>
            <div class="flex justify-between">
                <span>Tópico:</span>
                <span class="font-mono text-slate-300 truncate max-w-[200px]" title="gerry_sanchez_led_exclusivo/arduino">gerry_sanchez_led_exclusivo/arduino</span>
            </div>
        </div>

    </div>

    <script>
        // Inicializa os ícones Lucide
        lucide.createIcons();

        // Configurações MQTT via WebSocket (Porta 8884 para SSL no HiveMQ)
        const BROKER = "broker.hivemq.com";
        const PORTA = 8884;
        const TOPICO = "gerry_sanchez_led_exclusivo/arduino";
        const CLIENT_ID = "web_client_" + Math.random().toString(16).substr(2, 8);

        let cliente = new Paho.MQTT.Client(BROKER, Number(PORTA), CLIENT_ID);

        // Callbacks
        cliente.onConnectionLost = aoPerderConexao;
        cliente.onMessageArrived = aoChegarMensagem;

        // Conectar ao Broker
        conectar();

        function conectar() {
            atualizarStatus("Conectando...", "amber");
            cliente.connect({
                onSuccess: aoConectarSucesso,
                onFailure: aoConectarFalha,
                useSSL: true
            });
        }

        function aoConectarSucesso() {
            atualizarStatus("Conectado", "emerald");
            cliente.subscribe(TOPICO);
            console.log("Inscrito no tópico: " + TOPICO);
        }

        function aoConectarFalha(responseObject) {
            atualizarStatus("Erro Conexão", "rose");
            console.error("Falha ao conectar: " + responseObject.errorMessage);
            setTimeout(conectar, 5000); // Tentar reconectar em 5 segundos
        }

        function aoPerderConexao(responseObject) {
            atualizarStatus("Desconectado", "rose");
            if (responseObject.errorCode !== 0) {
                console.warn("Conexão perdida: " + responseObject.errorMessage);
                setTimeout(conectar, 3000);
            }
        }

        function aoChegarMensagem(message) {
            const comando = message.payloadString.trim();
            console.log("Mensagem recebida:", comando);
            
            if (comando === "1") {
                atualizarInterfaceLED(true);
            } else if (comando === "0") {
                atualizarInterfaceLED(false);
            }
        }

        function enviarComando(valor) {
            if (cliente.isConnected()) {
                const mensagem = new Paho.MQTT.Message(valor);
                mensagem.destinationName = TOPICO;
                cliente.send(mensagem);
                atualizarInterfaceLED(valor === "1");
            } else {
                alert("O cliente MQTT não está conectado ao broker!");
            }
        }

        function atualizarInterfaceLED(ligado) {
            const ledIndicator = document.getElementById("led-indicator");
            const ledIcon = document.getElementById("led-icon");
            const ledStatusText = document.getElementById("led-status-text");

            if (ligado) {
                ledIndicator.className = "w-24 h-24 rounded-full bg-emerald-500 border-4 border-emerald-300 flex items-center justify-center transition-all duration-300 led-glow-on";
                ledIcon.className = "w-10 h-10 text-white transition-colors duration-300";
                ledStatusText.innerText = "LED Ligado";
                ledStatusText.className = "text-sm font-bold text-emerald-400 uppercase tracking-wider";
            } else {
                ledIndicator.className = "w-24 h-24 rounded-full bg-slate-800 border-4 border-slate-600 flex items-center justify-center transition-all duration-300 led-glow-off";
                ledIcon.className = "w-10 h-10 text-slate-600 transition-colors duration-300";
                ledStatusText.innerText = "LED Desligado";
                ledStatusText.className = "text-sm font-medium text-slate-400 uppercase tracking-wider";
            }
        }

        function atualizarStatus(texto, cor) {
            const statusBadge = document.getElementById("status-badge");
            const statusDot = document.getElementById("status-dot");
            const statusText = document.getElementById("status-text");

            statusText.innerText = texto;

            if (cor === "emerald") {
                statusBadge.className = "flex items-center space-x-2 px-3 py-1 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-xs font-semibold";
                statusDot.className = "w-2 h-2 rounded-full bg-emerald-400";
            } else if (cor === "rose") {
                statusBadge.className = "flex items-center space-x-2 px-3 py-1 rounded-full bg-rose-500/10 text-rose-400 border border-rose-500/20 text-xs font-semibold";
                statusDot.className = "w-2 h-2 rounded-full bg-rose-400";
            } else { // amber / default
                statusBadge.className = "flex items-center space-x-2 px-3 py-1 rounded-full bg-amber-500/10 text-amber-400 border border-amber-500/20 text-xs font-semibold";
                statusDot.className = "w-2 h-2 rounded-full bg-amber-400 animate-pulse";
            }
        }
    </script>
</body>
</html>
